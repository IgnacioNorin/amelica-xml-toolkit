[project]
name = "amelica"
version = "2.0.0"
description = "Automatizacion de carga de articulos cientificos en AmeliCA XML"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "python-docx>=1.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Web local para convertir .idml (amelica/idml/webapp.py)
idml = ["flask>=3.0"]
# Conversion DOCX -> HTML usando Microsoft Word instalado. Opcional: si falta,
# zip_tools cae al conversor propio (ver build_zip_from_docx).
word = ["pywin32>=306"]
dev = ["pytest>=8.0"]

[project.scripts]
amelica = "amelica.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amelica*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
